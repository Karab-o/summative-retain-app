# Render Blueprint: deploys the API and the frontend together.
# In Render: New > Blueprint > pick this repository, then fill in the values marked "sync: false".
services:
  - type: web
    name: retain-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL # URL of the retain-web site, e.g. https://retain-web.onrender.com
        sync: false
      - key: ADMIN_EMAIL # admin account created on first start
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: retain-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Single-page app: let React Router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # URL of the retain-api service + /api, e.g. https://retain-api.onrender.com/api
        sync: false
      - key: VITE_CURRENCY
        value: USD
      - key: VITE_SHOW_DEMO_ACCOUNTS # "true" shows buttons that fill in the demo logins
        value: "true"
